name: Diagnostico fontes atletas Tigre
on:
  push:
    branches: ['feat/player-data-refresh-20261019']
    paths:
      - '.github/workflows/probe-player-data.yml'
      - 'scripts/probe-player-data.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-player-data.mjs
