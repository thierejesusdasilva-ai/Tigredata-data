name: Atualizar jogos Criciuma - Fonte verificada

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-scores.mjs'
      - 'tests/refresh-scores.test.mjs'
      - '.github/workflows/update-scores.yml'
  pull_request:
    paths:
      - 'scripts/refresh-scores.mjs'
      - 'tests/refresh-scores.test.mjs'
      - '.github/workflows/update-scores.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read

concurrency:
  group: tigre-scores-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/refresh-scores.mjs
      - run: node --test tests/refresh-scores.test.mjs

  refresh:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buscar e validar jogos do Criciuma
        run: node scripts/refresh-scores.mjs
      - name: Enviar JSON ao feed lido pelo aplicativo
        run: |
          if git diff --quiet -- latest.json; then
            echo "Fonte consultada; nenhuma alteracao material para publicar."
            exit 0
          fi
          git config user.name "tigre-data-updater[bot]"
          git config user.email "tigre-data-updater@users.noreply.github.com"
          git add latest.json
          git commit -m "Atualiza placares e jogos verificados do Criciuma"
          git push
      - name: Registrar estado da atualizacao
        if: always()
        run: |
          echo "A fonte de dados nao atualiza o app quando esta indisponivel." >> "$GITHUB_STEP_SUMMARY"
          echo "Consulte o resultado deste workflow. Nenhum placar e inventado." >> "$GITHUB_STEP_SUMMARY"
