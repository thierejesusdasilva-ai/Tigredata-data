name: Verificar acesso a mapas do Sofascore
on:
  push:
    branches: [feat/sofascore-heatmap-probe-20261019]
    paths:
      - 'scripts/sofascore-heatmap-probe.mjs'
      - '.github/workflows/sofascore-heatmap-probe.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sofascore-heatmap-probe.mjs
